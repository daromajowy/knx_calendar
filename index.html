<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KNX Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen app. Header bar, weekday strip, 6-week month grid filling the rest; dialogs as bottom sheets on phones. Tokens follow the Delitech Kanban app. */
:root {
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --text: #202931; --bg: #fff; --surface: #fff; --subtle: #f6f7fa; --column: #f3f5f8;
  --muted: #66727f; --border: #dfe4ea; --soft: #edf0f3; --hover: #edf0f5;
  --accent: #4f46e5; --accent-fill: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef2ff; --on-accent: #fff;
  --danger: #be3450; --danger-bg: #fff4f5; --success: #277b62; --success-bg: #edf6f2; --warning: #96500d; --warning-bg: #fffbed;
  --row-min: 124px; --other-month: #f9fafc; --today-ring: #4f46e5; --shadow: 0 12px 40px #1b213033;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --text: #eceef3; --bg: #202124; --surface: #2c2e33; --subtle: #303237; --column: #25272b;
  --muted: #b0b6c1; --border: #454850; --soft: #3b3e46; --hover: #3b3e46;
  --accent: #b1b5ff; --accent-fill: #6366f1; --accent-hover: #7779f5; --accent-soft: #373951; --on-accent: #fff;
  --danger: #ffabbc; --danger-bg: #432d35; --success: #8ddbbd; --success-bg: #283d35; --warning: #f5cd82; --warning-bg: #3c352a;
  --other-month: #1c1d20; --today-ring: #8b8ffa; --shadow: 0 12px 40px #00000080; color-scheme: dark; } }
:root[data-theme="dark"] {
  --text: #eceef3; --bg: #202124; --surface: #2c2e33; --subtle: #303237; --column: #25272b;
  --muted: #b0b6c1; --border: #454850; --soft: #3b3e46; --hover: #3b3e46;
  --accent: #b1b5ff; --accent-fill: #6366f1; --accent-hover: #7779f5; --accent-soft: #373951; --on-accent: #fff;
  --danger: #ffabbc; --danger-bg: #432d35; --success: #8ddbbd; --success-bg: #283d35; --warning: #f5cd82; --warning-bg: #3c352a;
  --other-month: #1c1d20; --today-ring: #8b8ffa; --shadow: 0 12px 40px #00000080; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #818cf8; outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { color: var(--muted); font-size: 10px; letter-spacing: 1.4px; font-weight: 700; text-transform: uppercase; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13px; min-height: 34px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.icon-btn { width: 34px; padding: 0; }
svg.i { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Login */
.auth { height: 100%; display: grid; place-items: center; padding-inline: 16px; background: var(--column); overflow-y: auto; }
.auth-card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; display: grid; gap: 14px; margin-block: 24px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; letter-spacing: -.5px; }
.brand-symbol { width: 28px; height: 28px; border-radius: 7px; background: var(--accent-fill); color: #fff; display: inline-grid; place-items: center; }
.brand .slash { color: var(--muted); font-weight: 500; }
.auth h1 { font-size: 22px; letter-spacing: -.6px; text-wrap: balance; }
.field { display: grid; gap: 5px; font-weight: 600; font-size: 12px; }
.field input, .field select, .field textarea { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; background: var(--surface); font-weight: 400; font-size: 14px; min-width: 0; width: 100%; }
.field textarea { resize: vertical; min-height: 84px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent-fill); outline: 2px solid #6366f133; }
.demo-users { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px 3px 3px; background: var(--surface); font-size: 12px; font-weight: 600; }
button.chip:hover { background: var(--hover); }
.avatar { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; flex-shrink: 0; }
.note { border-radius: 8px; padding: 9px 11px; font-size: 12px; line-height: 1.5; background: var(--accent-soft); }
.note.warn { background: var(--warning-bg); color: var(--warning); }
.error { color: var(--danger); font-size: 12px; font-weight: 600; }

/* App shell */
.app { height: 100%; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.month-title { font-size: 20px; font-weight: 800; letter-spacing: -.6px; min-width: 0; text-transform: capitalize; }
.month-title .year { color: var(--muted); font-weight: 500; }
.nav { display: flex; gap: 2px; }
.spacer { flex: 1; }
.top-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.filter { border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; background: var(--surface); font-size: 12px; max-width: 160px; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent-fill); color: #fff; font-size: 10px; font-weight: 700; display: inline-grid; place-items: center; }
.user-btn { padding: 3px 10px 3px 3px; border-radius: 999px; }

.weekdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--border); background: var(--surface); }
.weekdays div { padding: 6px 8px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; text-align: center; }
.weekdays div.weekend { color: var(--danger); opacity: .8; }

.grid { flex: 1; display: grid; grid-template-rows: repeat(6, minmax(var(--row-min), 1fr)); min-height: 0; overflow-y: auto; touch-action: pan-y; }
.week { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--soft); min-height: 0; overflow: hidden; }
.day { border-right: 1px solid var(--soft); padding: 6px 4px 0; text-align: center; cursor: pointer; background: var(--bg); min-width: 0; position: relative; }
.day:last-child { border-right: 0; }
.day:hover { background: var(--subtle); }
.day.other { background: var(--other-month); }
.day.other .num { color: var(--muted); opacity: .6; }
.num { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.day.today .num { background: var(--accent-fill); color: #fff; }
.day.weekend:not(.other) .num { color: var(--danger); }
.day.today.weekend .num { color: #fff; }
.more { position: absolute; left: 2px; right: 2px; bottom: 3px; height: 16px; font-size: 11px; font-weight: 700; color: var(--muted); border: 0; background: transparent; border-radius: 4px; padding: 1px 0; }
.more:hover { background: var(--hover); color: var(--text); }

.bars { position: absolute; inset: 0; pointer-events: none; }
.bar { position: absolute; height: 18px; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; pointer-events: auto; border: 0; text-align: left; display: flex; gap: 4px; align-items: center; }
.bar:hover { filter: brightness(1.08); box-shadow: 0 1px 4px #0003; }
.bar.cont-left { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.bar.cont-right { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.bar .bell { width: 11px; height: 11px; stroke-width: 2.5; }
.bar.dim { opacity: .25; }

.fab { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 16px; border: 0; background: var(--accent-fill); color: #fff; box-shadow: var(--shadow); display: grid; place-items: center; }
.fab:hover { background: var(--accent-hover); }
.fab svg.i { width: 26px; height: 26px; }

/* Dialogs */
dialog { border: 0; padding: 0; border-radius: 16px; background: var(--surface); color: var(--text); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); box-shadow: var(--shadow); }
dialog::backdrop { background: #10131a80; }
.sheet { display: flex; flex-direction: column; max-height: calc(100vh - 32px); }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; padding: 16px 18px 10px; }
.sheet-head h2 { font-size: 18px; letter-spacing: -.4px; flex: 1; min-width: 0; overflow-wrap: anywhere; text-wrap: balance; }
.sheet-body { padding: 4px 18px 16px; overflow-y: auto; display: grid; gap: 14px; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--soft); flex-wrap: wrap; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 12px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent-fill); }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.person { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; cursor: pointer; min-width: 0; }
.person:has(input:checked) { border-color: var(--accent-fill); background: var(--accent-soft); }
.person input { accent-color: var(--accent-fill); }
.person span.n { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person small { display: block; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person > div { min-width: 0; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; outline: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text); }
.reminder-box { border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--subtle); }
.hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
.mono { font-variant-numeric: tabular-nums; }

/* Event record */
.rec-stripe { width: 14px; height: 14px; border-radius: 4px; margin-top: 5px; flex-shrink: 0; }
.rec { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px 10px; align-items: start; }
.rec svg.i { color: var(--muted); margin-top: 1px; }
.rec .val { line-height: 1.5; overflow-wrap: anywhere; }
.rec .val strong { font-weight: 700; }
.desc { white-space: pre-wrap; }
.plist { display: flex; flex-wrap: wrap; gap: 6px; }
.status-pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; }
.status-pill.on { background: var(--success-bg); color: var(--success); }
.status-pill.off { background: var(--subtle); color: var(--muted); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--danger-bg); color: var(--danger); border-radius: 8px; padding: 8px 10px; font-weight: 600; }

/* Day list + outbox */
.list { display: grid; gap: 6px; }
.list-item { display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; background: var(--surface); text-align: left; width: 100%; min-width: 0; }
.list-item:hover { background: var(--hover); }
.list-item .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.list-item .t { font-weight: 700; overflow-wrap: anywhere; }
.list-item > div { min-width: 0; flex: 1; }
.mail { border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; display: grid; gap: 6px; }
.mail-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.mail .to { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.status-pill.sent { background: var(--success-bg); color: var(--success); }
.status-pill.queued { background: var(--warning-bg); color: var(--warning); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100% - 32px); z-index: 10; }
.proto-tag { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--warning); background: var(--warning-bg); border-radius: 6px; padding: 3px 7px; }

@media (max-width: 640px) {
  .topbar { padding: 6px 12px; gap: 6px; }
  .month-title { font-size: 17px; }
  .hide-sm { display: none !important; }
  :root { --row-min: 96px; }
  .day { padding: 4px 1px 0; }
  .num { width: 24px; height: 24px; font-size: 12px; }
  .more { font-size: 10px; }
  .bar { height: 15px; line-height: 15px; font-size: 9.5px; padding: 0 3px; border-radius: 3px; }
  .bar .bell { display: none; }
  .weekdays div { padding: 4px 0; font-size: 10px; letter-spacing: 0; }
  dialog { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 16px 16px 0 0; max-height: 92%; }
  .sheet { max-height: 92vh; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .row2 { grid-template-columns: 1fr; }
  .filter { max-width: 120px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar { transition: filter .12s; }
  dialog[open] { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(12px); opacity: .6; } }
}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
// ---------- Icons ----------
const I = {
  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>', cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  text: '<path d="M4 6h16M4 12h16M4 18h10"/>', users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/>', edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>', moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>', lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
};
const icon = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- Dates (local YYYY-MM-DD strings; noon avoids DST edges) ----------
const MONTHS = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const MONTHS_GEN = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const WD = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];
const WD_LONG = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const TODAY = iso(new Date());
const fmtDay = s => { const d = parse(s); return `${WD_LONG[d.getDay()]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${MONTHS_GEN[d.getMonth()].slice(0, 3)}`; };
const daysLabel = n => n === 1 ? '1 dzień' : `${n} dni`;
function fmtRange(e) {
  const n = diffDays(e.start, e.end) + 1;
  const time = e.allDay ? 'cały dzień' : `${e.startTime || '—'}–${e.endTime || '—'}`;
  if (n === 1) return `${fmtDay(e.start)} · ${time}`;
  return `${fmtShort(e.start)} – ${fmtDay(e.end)} · ${daysLabel(n)}${e.allDay ? '' : ' · ' + time}`;
}

// ---------- Sample data (examples only) ----------
const COLORS = ['#4f46e5', '#0d9488', '#d97706', '#be3450', '#2563eb', '#7c3aed', '#15803d', '#64748b'];
const USERS = [
  { id: 'u1', name: 'Darek', email: 'darek@example.com', role: 'admin', color: '#6366f1' },
  { id: 'u2', name: 'Jan', email: 'jan@example.com', role: 'member', color: '#0d9488' },
  { id: 'u3', name: 'Anna', email: 'anna@example.com', role: 'member', color: '#d97706' },
  { id: 'u4', name: 'Michał', email: 'michal@example.com', role: 'member', color: '#be3450' },
  { id: 'u5', name: 'Kasia', email: 'kasia@example.com', role: 'member', color: '#2563eb' },
  { id: 'u6', name: 'Piotr', email: 'piotr@example.com', role: 'member', color: '#15803d' },
];
const userById = id => USERS.find(u => u.id === id);
const initials = n => n.slice(0, 2).toUpperCase();
const av = u => `<span class="avatar" style="background:${u.color}">${esc(initials(u.name))}</span>`;

function seedEvents() {
  const m = TODAY.slice(0, 8);
  const d = n => m + pad(n);
  const mk = (id, title, start, end, o = {}) => ({ id, title, start, end, allDay: true, startTime: '', endTime: '', place: '', description: '', people: [], color: COLORS[0], reminder: null, createdBy: 'u1', ...o });
  return [
    mk('e1', 'Montaż instalacji KNX – biurowiec Wrocław', d(5), d(9), { place: 'ul. Strzegomska 42, Wrocław', description: 'Montaż aktorów i czujników na piętrach 2–4. Zabrać programator i laptopa z ETS6.', people: ['u2', 'u4'], color: COLORS[1], reminder: { offset: 1, scope: 'people' } }),
    mk('e2', 'Spotkanie z klientem – projekt Willa Sowa', d(8), d(8), { allDay: false, startTime: '10:00', endTime: '11:30', place: 'Biuro Delitech, sala 1', description: 'Omówienie scenariuszy oświetlenia i sterowania roletami.', people: ['u1', 'u3'], color: COLORS[0], reminder: { offset: 0, scope: 'people' } }),
    mk('e3', 'Urlop', d(12), d(16), { people: ['u3'], color: COLORS[7], description: 'Anna niedostępna.' }),

// ---------- State & persistence (browser-only in this prototype) ----------
const KEY = 'knx-calendar-proto-v1';
let state = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.events)) return s; } catch (_) {}
  return { user: null, events: seedEvents(), outbox: [], filter: '', month: TODAY.slice(0, 7) };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {} }
if (!state.outbox.length) state.outbox = state.events.filter(e => e.reminder).map(planMail);

const OFFSETS = [[0, 'W dniu wydarzenia (8:00)'], [1, '1 dzień przed'], [2, '2 dni przed'], [7, 'Tydzień przed']];
function recipients(e) {
  const ids = e.reminder?.scope === 'all' ? USERS.map(u => u.id) : e.people;
  return ids.map(userById).filter(Boolean);
}
function planMail(e) {
  return { id: 'm' + Math.random().toString(36).slice(2, 9), eventId: e.id, sendOn: addDays(e.start, -e.reminder.offset), to: recipients(e).map(u => u.email),
    subject: `Przypomnienie: ${e.title} (${fmtShort(e.start)})`, status: 'queued' };
}
function syncMail(e) {
  state.outbox = state.outbox.filter(m => m.eventId !== e.id || m.status === 'sent');
  if (e.reminder && e.people.length + (e.reminder.scope === 'all' ? 1 : 0)) state.outbox.push(planMail(e));
}

function weeksOf(month) {
  const first = parse(month + '-01');
  const shift = (first.getDay() + 6) % 7; // Monday first
  const start = addDays(month + '-01', -shift);
  return Array.from({ length: 6 }, (_, w) => Array.from({ length: 7 }, (_, d) => addDays(start, w * 7 + d)));
}
function visibleEvents() { return state.events; }
const matchesFilter = e => !state.filter || e.people.includes(state.filter);

  // swipe between months on touch screens
  const grid = root.querySelector('#grid');
  let sx = null, sy = null;
  grid.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  grid.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) nav(dx < 0 ? 1 : -1); });
  root.querySelector('.app').onkeydown = e => { if (dlg.open || e.target.matches('input,select,textarea')) return; if (e.key === 'ArrowLeft') nav(-1); if (e.key === 'ArrowRight') nav(1); };
  layoutGrid();
}

function layoutGrid() {
  const grid = document.getElementById('grid'); if (!grid) return;
  const small = matchMedia('(max-width: 640px)').matches;
  const BAR = small ? 15 : 18, GAP = 2, TOP = small ? 34 : 44, MORE = 20;
  const weeks = weeksOf(state.month);
  grid.innerHTML = weeks.map((w, wi) => `<div class="week" data-w="${wi}">${w.map((day, di) => {
    const cls = ['day', day.slice(0, 7) !== state.month && 'other', day === TODAY && 'today', di > 4 && 'weekend'].filter(Boolean).join(' ');
    return `<div class="${cls}" data-day="${day}" role="button" tabindex="0" aria-label="${fmtDay(day)}, dodaj wydarzenie"><span class="num">${parse(day).getDate()}</span></div>`;
  }).join('')}<div class="bars"></div></div>`).join('');
  const rowH = grid.querySelector('.week').clientHeight;
  const lanesFit = Math.max(1, Math.floor((rowH - TOP - MORE) / (BAR + GAP)));
  grid.querySelectorAll('.week').forEach((row, wi) => {
    const w = weeks[wi], ws = w[0], we = w[6];
    const evs = visibleEvents().filter(e => e.end >= ws && e.start <= we)
      .sort((a, b) => a.start.localeCompare(b.start) || diffDays(b.start, b.end) - diffDays(a.start, a.end) || (a.startTime || '').localeCompare(b.startTime || ''));
    const lanes = []; const hidden = Array(7).fill(0); let html = '';
    for (const e of evs) {
      const c0 = Math.max(0, diffDays(ws, e.start)), c1 = Math.min(6, diffDays(ws, e.end));
      let lane = lanes.findIndex(l => l.every(([a, b]) => c1 < a || c0 > b));
      if (lane < 0) { lane = lanes.length; lanes.push([]); }
      lanes[lane].push([c0, c1]);
      const allFit = lanes.length <= lanesFit;
      // when a column overflows, its last visible lane becomes the "+N" row
      const limit = lanesFit;
      if (lane >= limit) { for (let c = c0; c <= c1; c++) hidden[c]++; continue; }
      html += barHtml(e, c0, c1, lane, TOP, BAR, GAP, e.start < ws, e.end > we);
    }
    row.querySelector('.bars').innerHTML = html;
    hidden.forEach((n, c) => { if (n) row.children[c].insertAdjacentHTML('beforeend', `<button class="more" data-more="${w[c]}">+${n} więcej</button>`); });
  });
  grid.querySelectorAll('.day').forEach(el => {
    el.onclick = ev => { if (ev.target.closest('.more')) return; openForm(null, el.dataset.day); };
    el.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openForm(null, el.dataset.day); } };
  });
  grid.querySelectorAll('.more').forEach(b => b.onclick = () => openDay(b.dataset.more));
  grid.querySelectorAll('.bar').forEach(b => b.onclick = ev => { ev.stopPropagation(); openRecord(b.dataset.id); });
}
function barHtml(e, c0, c1, lane, TOP, BAR, GAP, contL, contR) {
  const left = `calc(${c0} * 100% / 7 + 2px)`, width = `calc(${c1 - c0 + 1} * 100% / 7 - 4px)`;
  const cls = ['bar', contL && 'cont-left', contR && 'cont-right', !matchesFilter(e) && 'dim'].filter(Boolean).join(' ');
  const label = (!e.allDay && e.startTime ? e.startTime + ' ' : '') + e.title;
  return `<button class="${cls}" data-id="${e.id}" style="left:${left};width:${width};top:${TOP + lane * (BAR + GAP)}px;background:${e.color}" title="${esc(e.title)}">${e.reminder ? icon('bell', 'bell') : ''}<span style="overflow:hidden;text-overflow:ellipsis">${esc(label)}</span></button>`;
}
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layoutGrid, 120); });

    };
  });
}

    }
    $('#mRange').onclick = () => setMode('range'); $('#mDays').onclick = () => setMode('days');
    ['#fStart', '#fEnd', '#fDays', '#fOff', '#fScope'].forEach(s => $(s).oninput = upd);
    dlg.querySelectorAll('[name=people]').forEach(x => x.onchange = upd);
    $('#fAll').onchange = () => $('#timeRow').hidden = $('#fAll').checked;
    $('#fRem').onchange = () => { $('#remOpts').hidden = !$('#fRem').checked; upd(); };
    dlg.querySelectorAll('.swatch').forEach(b => b.onclick = () => { e.color = b.dataset.c; dlg.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    upd();
    $('#evForm').onsubmit = sub => {
      sub.preventDefault();
      const err = $('#fErr'); const fail = m => { err.hidden = false; err.textContent = m; };
      const title = $('#fTitle').value.trim(), s = $('#fStart').value, en = curEnd();
      if (!title) return fail('Podaj tytuł wydarzenia.');
      if (!s || !en) return fail('Podaj datę rozpoczęcia i zakończenia albo liczbę dni.');
      if (en < s) return fail('Data zakończenia nie może być wcześniejsza niż rozpoczęcia.');
      const allDay = $('#fAll').checked;
      if (!allDay && s === en && $('#fT2').value <= $('#fT1').value) return fail('Godzina zakończenia musi być późniejsza niż rozpoczęcia.');
      const rem = $('#fRem').checked ? { offset: +$('#fOff').value, scope: $('#fScope').value } : null;
      if (rem && rem.scope === 'people' && !people().length) return fail('Przypomnienie potrzebuje odbiorców. Zaznacz osoby zaangażowane.');
      Object.assign(e, { title, start: s, end: en, allDay, startTime: allDay ? '' : $('#fT1').value, endTime: allDay ? '' : $('#fT2').value, place: $('#fPlace').value.trim(), description: $('#fDesc').value.trim(), people: people(), reminder: rem });
      if (!e.id) { e.id = 'e' + Date.now().toString(36); state.events.push(e); } else state.events = state.events.map(x => x.id === e.id ? e : x);
      syncMail(e);
      state.month = s.slice(0, 7); save(); dlg.close(); renderApp();
      toast(rem ? `Zapisano. Przypomnienie zaplanowane na ${fmtShort(addDays(s, -rem.offset))}` : 'Zapisano wydarzenie');
    };
  });
}

function openOutbox() {
  const list = [...state.outbox].sort((a, b) => a.sendOn.localeCompare(b.sendOn));
  openDialog(`<div class="sheet">
    <div class="sheet-head"><div style="flex:1;min-width:0"><h2>Przypomnienia e-mail</h2><p class="hint">Kolejka wysyłki. W prototypie wysyłka jest symulowana i nic nie wychodzi na zewnątrz.</p></div><button class="btn ghost icon-btn" data-close aria-label="Zamknij">${icon('x')}</button></div>
    <div class="sheet-body">${list.length ? list.map(m => {
      const e = state.events.find(x => x.id === m.eventId);
      return `<div class="mail"><div class="mail-head"><strong style="overflow-wrap:anywhere">${esc(m.subject)}</strong><span class="status-pill ${m.status}">${m.status === 'sent' ? 'Wysłane' : 'Zaplanowane ' + fmtShort(m.sendOn)}</span></div>
        <div class="to">Do: ${esc(m.to.join(', '))}</div>
        ${e ? `<div class="hint">${esc(fmtRange(e))}${e.place ? ' · ' + esc(e.place) : ''}</div>` : ''}
        ${m.status === 'queued' ? `<div><button class="btn" data-send="${m.id}">${icon('mail')}Wyślij teraz (symulacja)</button></div>` : ''}</div>`;
    }).join('') : '<p class="muted">Brak zaplanowanych przypomnień. Zaznacz „Wyślij przypomnienie e-mailem” w wydarzeniu.</p>'}</div></div>`, () => {
    dlg.querySelectorAll('[data-send]').forEach(b => b.onclick = () => { const m = state.outbox.find(x => x.id === b.dataset.send); m.status = 'sent'; save(); openOutbox(); renderApp(); toast(`Symulacja: wysłano do ${m.to.length} odbiorców`); });
  });
}

function openAccount() {
  const me = userById(state.user);
  openDialog(`<div class="sheet">
    <div class="sheet-head"><h2>Konto</h2><button class="btn ghost icon-btn" data-close aria-label="Zamknij">${icon('x')}</button></div>
    <div class="sheet-body"><div style="display:flex;gap:10px;align-items:center">${av(me).replace('22px', '36px')}<div><strong>${esc(me.name)}</strong><div class="hint">${esc(me.email)} · ${me.role === 'admin' ? 'administrator' : 'członek'} tablicy Kanban</div></div></div>
      <button class="btn" id="reset">Przywróć przykładowe dane</button></div>
    <div class="sheet-foot"><button class="btn" id="logout">${icon('out')}Wyloguj</button></div></div>`, () => {
    dlg.querySelector('#logout').onclick = () => { state.user = null; save(); dlg.close(); render(); };
    dlg.querySelector('#reset').onclick = () => { state.events = seedEvents(); state.outbox = state.events.filter(e => e.reminder).map(planMail); state.month = TODAY.slice(0, 7); save(); dlg.close(); renderApp(); toast('Przywrócono przykładowe dane'); };
  });
}

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

render();
</script>
</body>
</html>
